<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全屏嵌入</title>
<style>
*{
    margin:0;
    padding:0;
    border:0;
}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}
iframe{
    width:100vw;
    height:100vh;
    border:none;
    display:block;
}
/* 弹窗样式 */
.modal{
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
}
.modal-box{
    background:#fff;
    padding:30px;
    border-radius:12px;
    max-width:400px;
    text-align:center;
}
.modal-box h2{
    margin-bottom:16px;
    color:#222;
}
.modal-box p{
    color:#555;
    margin-bottom:20px;
}
.modal-box button{
    padding:10px 24px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>
<body>
<!-- 弹窗 -->
<div class="modal" id="myModal">
    <div class="modal-box">
        <h2>提示</h2>
        <p>欢迎访问本站</p>
        <button onclick="closeModal()">确认进入</button>
    </div>
</div>

<iframe src="https://gosharetask.com"></iframe>

<script>
const modal = document.getElementById('myModal');
function closeModal(){
    modal.style.display = "none";
}
</script>
</body>
</html>
